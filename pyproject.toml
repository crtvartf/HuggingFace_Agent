[project]
name = "gaia-agent"
version = "0.1.0"
description = "smolagents GAIA agent for the Hugging Face Agents Course (Unit 4), running via OpenRouter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix-otel>=0.17.2",
    "av>=17,<19",
    "chess>=1.11.2",
    "cssselect>=1.5.0",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "lxml>=6.1.3",
    "markdownify>=1.2.3",
    "openai>=3.26.1",
    "openinference-instrumentation-smolagents>=0.1.42",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.0",
    "pyyaml>=6.0.3",
    "smolagents>=1.26.0",
    "tabulate>=0.10.0",
    "tavily-python>=0.8.5",
    "trafilatura>=2.3.1",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
gaia = "gaia_agent.cli:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
